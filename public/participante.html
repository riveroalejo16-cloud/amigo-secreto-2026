<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Amigo Secreto</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><section class="card"><div class="brand">🎁</div><h1>Mi Amigo Secreto</h1><p id="hello" class="muted"></p><div id="area"></div><button class="btn2" id="logout">Cerrar sesión</button></section></main><script src="/background.js"></script><script>(async()=>{const r=await fetch('/api/me');if(!r.ok){location.href='/';return}const d=await r.json();document.querySelector('#hello').textContent='Hola, '+d.participant.name+' 👋';const a=document.querySelector('#area');if(d.participant.drawn){a.innerHTML='<div class="result">🎉 Ya realizaste tu tiro.<br><small>Tu resultado ya fue revelado.</small></div>'}else{a.innerHTML='<p class="muted">Cuando estés listo, gira la ruleta para descubrir tu amigo secreto.</p><div class="roulette-wrap"><div class="pointer">▼</div><div id="wheel" class="wheel"><div id="wheelNames"></div></div></div><button id="draw">🎡 Girar la ruleta</button><p id="rouletteMsg" class="muted" style="margin-top:12px"></p>';const nr=await fetch('/api/participants');if(nr.ok){const nd=await nr.json();document.querySelector('#wheelNames').innerHTML=nd.participants.map((p,i)=>'<span style="--i:'+i+'">'+p.name+'</span>').join('')}document.querySelector('#draw').onclick=async()=>{if(!confirm('¿Estás seguro? Solo puedes hacer un tiro.'))return;const btn=document.querySelector('#draw');btn.disabled=true;btn.textContent='🎡 Girando...';try{const x=await fetch('/api/draw',{method:'POST'});const z=await x.json();if(!x.ok){alert(z.error||'No fue posible realizar el tiro');btn.disabled=false;btn.textContent='🎡 Girar la ruleta';return}document.querySelector('#wheel').classList.add('spinning');setTimeout(()=>{a.innerHTML='<div id="secretResult" class="result">🎉<br>Tu amigo secreto es:<br><strong>'+z.target+'</strong><br><button id="downloadResult" style="margin-top:18px">📥 Descargar mi resultado</button></div>';document.querySelector('#downloadResult').onclick=()=>downloadResult(z.target,d.participant.name)},4200)}catch(e){alert('No fue posible realizar el tiro');btn.disabled=false;btn.textContent='🎡 Girar la ruleta'}}}})();function downloadResult(target,giver){const c=document.createElement('canvas'),x=c.getContext('2d');c.width=1080;c.height=1350;x.fillStyle='#f5f7ff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#172033';x.textAlign='center';x.font='bold 70px Arial';x.fillText('🎁 MI AMIGO SECRETO',540,260);x.font='42px Arial';x.fillText('Hola, '+giver,540,430);x.font='bold 58px Arial';x.fillText('Tu amigo secreto es:',540,610);x.font='bold 68px Arial';const words=target.split(' ');let line='',lines=[];for(const w of words){const test=line?line+' '+w:w;if(x.measureText(test).width>900){lines.push(line);line=w}else line=test}if(line)lines.push(line);lines.forEach((l,i)=>x.fillText(l,540,730+i*90));x.font='32px Arial';x.fillText('🎄 Amigo Secreto 2026 🎄',540,1120);const a=document.createElement('a');a.download='mi-amigo-secreto-2026.png';a.href=c.toDataURL('image/png');a.click()}document.querySelector('#logout').onclick=async()=>{await fetch('/api/logout');location.href='/'};</script></body></html>
