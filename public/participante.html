<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Amigo Secreto</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><section class="card"><div class="brand">🎁</div><h1>Mi Amigo Secreto</h1><p id="hello" class="muted"></p><div id="area"></div><button class="btn2" id="logout">Cerrar sesión</button></section></main><script>(async()=>{const r=await fetch('/api/me');if(!r.ok){location.href='/';return}const d=await r.json();document.querySelector('#hello').textContent='Hola, '+d.participant.name+' 👋';const a=document.querySelector('#area');if(d.participant.drawn){a.innerHTML='<div class="result">🎉 Ya realizaste tu tiro.<br><small>Tu resultado ya fue revelado.</small></div>'}else{a.innerHTML='<p class="muted">Cuando estés listo, haz tu único tiro.</p><button id="draw">🎲 Sacar mi amigo secreto</button>';document.querySelector('#draw').onclick=async()=>{if(!confirm('¿Estás seguro? Solo puedes hacer un tiro.'))return;const x=await fetch('/api/draw',{method:'POST'});const z=await x.json();if(!x.ok){alert(z.error||'No fue posible realizar el tiro');return}a.innerHTML='<div class="result">🎉 Tu amigo secreto es:<br>'+z.target+'</div>'}}})();document.querySelector('#logout').onclick=async()=>{await fetch('/api/logout');location.href='/'};</script></body></html>
