<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · Amigo Secreto 2026</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><section class="panel"><div class="top"><div><h1>Panel de administración</h1><p class="muted">Amigo Secreto 2026</p></div><button id="logout" class="btn2" style="width:auto">Cerrar sesión</button></div><div class="card" style="width:100%;margin-bottom:18px"><h2>Control de la dinámica</h2><p>También puedes reiniciar únicamente el tiro de un participante, sin afectar a los demás.</p><button id="reset" class="danger">Reiniciar todos y sortear nuevamente</button></div><div class="card" style="width:100%"><h2>Participantes y resultados</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Nombre</th><th>Género</th><th>Usuario</th><th>Estado</th><th>Amigo secreto</th><th>Acción</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script>async function load(){const r=await fetch('/api/admin');if(!r.ok){location.href='/';return}const d=await r.json();document.querySelector('#rows').innerHTML=d.participants.map(p=>`<tr><td>${p.name}</td><td>${p.gender}</td><td>${p.username}</td><td>${p.drawn?'✅ Realizado':'⏳ Pendiente'}</td><td>${p.target||'—'}</td><td>${p.drawn?`<button class="btn2 reset-user" data-id="${p.id}" style="width:auto">Reiniciar tiro</button>`:'—'}</td></tr>`).join('');document.querySelectorAll('.reset-user').forEach(b=>b.onclick=async()=>{const id=b.dataset.id;const nombre=b.closest('tr').children[0].textContent;if(!confirm(`¿Reiniciar únicamente el tiro de ${nombre}? Su asignación se conservará y podrá volver a revelar el mismo amigo.`))return;const r=await fetch('/api/admin/reset-user',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});const d=await r.json().catch(()=>({}));alert(r.ok?'Tiro reiniciado correctamente.':(d.error||'No se pudo reiniciar.'));load()})}load();document.querySelector('#reset').onclick=async()=>{if(!confirm('Esto cambiará todos los resultados. ¿Continuar?'))return;const r=await fetch('/api/admin/reset',{method:'POST'});alert(r.ok?'Dinámica reiniciada correctamente.':'No se pudo reiniciar.');load()};document.querySelector('#logout').onclick=async()=>{await fetch('/api/logout');location.href='/'};</script></body></html>
